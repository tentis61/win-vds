name: Windows-VDS

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Uzak Masaustunu Ac ve Sifre Belirle
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        net user runneradmin Sifre12345!

    - name: Tmate Indir ve Baglan
      run: |
        Invoke-WebRequest https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-win64.zip -OutFile tmate.zip
        Expand-Archive tmate.zip
        .\tmate-2.4.0-win64\tmate.exe -F
