name: Windows-VDS

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: AnyDesk Indir ve Kur
      run: |
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"
        .\AnyDesk.exe --install "C:\Program Files (x86)\AnyDesk" --start-with-win --silent

    - name: AnyDesk Sifresi Belirle
      run: |
        echo "Sifre12345!" | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password

    - name: AnyDesk ID Al ve Calisir Tut
      run: |
        $id = & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id
        Write-Host "=========================================="
        Write-Host "ANYDESK ADRESINIZ (ID): $id"
        Write-Host "SIFRE: Sifre12345!"
        Write-Host "=========================================="
        while ($true) { Start-Sleep -Seconds 60 }
